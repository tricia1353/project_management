<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>概念 C · 禅意留白</title>
<style>
  :root{
    --bg:#f7f5f1; --text:#23211c; --muted:#9a948a; --accent:#b4654a; --line:rgba(35,33,28,.1);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Serif SC",serif;color:var(--text);background:var(--bg);min-height:100vh;}
  .wrap{max-width:980px;margin:0 auto;padding:88px 40px 80px;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:72px;border-bottom:1px solid var(--line);padding-bottom:24px;}
  .brand{font-size:22px;font-weight:600;letter-spacing:.04em;}
  .cta{font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:8px 16px;}
  .hero{margin-bottom:64px;}
  .hero h1{font-size:30px;font-weight:600;margin:0 0 14px;line-height:1.5;}
  .hero p{color:var(--muted);margin:0;font-size:14px;line-height:2;max-width:520px;}
  .section-label{font-size:11px;letter-spacing:.3em;color:var(--muted);margin:0 0 20px;text-transform:uppercase;}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:48px;align-items:start;}
  .list .row{padding:14px 0;border-bottom:1px solid var(--line);}
  .list .row .n{font-size:14px;}
  .list .row .t{font-size:12px;color:var(--muted);margin-top:3px;}
  .projects{display:flex;flex-direction:column;gap:14px;}
  .proj{padding:22px 24px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.4);transition:.25s;}
  .proj:hover{border-color:var(--accent);transform:translateX(4px);}
  .proj b{font-size:16px;font-weight:600;}
  .proj span{font-size:12px;color:var(--muted);margin-left:10px;}
  .foot{margin-top:64px;color:var(--muted);font-size:12px;letter-spacing:.04em;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Kanban</div>
    <div class="cta">智能分类</div>
  </header>
  <div class="hero">
    <h1>少，即是清晰。</h1>
    <p>去掉一切多余的装饰，只留下你与项目之间的对话。留白，是给思考的空间。</p>
  </div>
  <div class="grid">
    <div>
      <p class="section-label">扫描池</p>
      <div class="list">
        <div class="row"><div class="n">用户访谈纪要.docx</div><div class="t">2026-07-12</div></div>
        <div class="row"><div class="n">竞品分析.pdf</div><div class="t">2026-07-10</div></div>
        <div class="row"><div class="n">需求草稿.md</div><div class="t">2026-07-14</div></div>
        <div class="row"><div class="n">视觉规范.png</div><div class="t">2026-07-09</div></div>
      </div>
    </div>
    <div>
      <p class="section-label">项目</p>
      <div class="projects">
        <div class="proj"><b>用户研究</b><span>12 个文件</span></div>
        <div class="proj"><b>品牌升级</b><span>8 个文件</span></div>
        <div class="proj"><b>核心产品</b><span>23 个文件</span></div>
        <div class="proj"><b>视觉系统</b><span>9 个文件</span></div>
      </div>
    </div>
  </div>
  <div class="foot">概念 C · 禅意留白 — 暖白底 · 极致留白 · 字体重 · 无图标</div>
</div>
</body>
</html>
