<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>概念 B · 极光呼吸</title>
<style>
  :root{
    --bg:#fbfcff; --text:#1f2430; --muted:#8b93a7; --accent:#6d5efc; --soft:#eef0ff;
    --card:rgba(255,255,255,.7);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;position:relative;}
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55;
    background:
      radial-gradient(500px 500px at 12% 18%, rgba(124,140,255,.5), transparent 60%),
      radial-gradient(520px 520px at 88% 22%, rgba(90,209,230,.45), transparent 60%),
      radial-gradient(600px 600px at 60% 95%, rgba(190,130,255,.4), transparent 60%);
  }
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:72px 32px 80px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px;}
  .brand{font-size:19px;font-weight:700;letter-spacing:.04em;}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.2em;margin-top:4px;}
  .cta{font-size:13px;color:#4b3fd6;padding:10px 18px;border-radius:999px;background:var(--soft);border:1px solid rgba(109,94,252,.25);}
  .hero{margin-bottom:44px;}
  .hero h1{font-size:32px;font-weight:700;margin:0 0 12px;letter-spacing:.01em;}
  .hero p{color:var(--muted);margin:0;font-size:14px;line-height:1.9;max-width:540px;}
  .grid{display:grid;grid-template-columns:330px 1fr;gap:26px;align-items:start;}
  .panel{background:var(--card);border:1px solid rgba(20,30,80,.06);border-radius:22px;padding:22px;backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(40,50,120,.06);}
  .panel h3{margin:0 0 16px;font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:700;}
  .file{display:flex;justify-content:space-between;padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.6);margin-bottom:10px;border:1px solid rgba(20,30,80,.05);}
  .file .n{font-size:13px;font-weight:500;}
  .file .t{font-size:11px;color:var(--muted);}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .card{padding:20px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.55));border:1px solid rgba(20,30,80,.06);backdrop-filter:blur(12px);box-shadow:0 16px 40px rgba(60,70,140,.07);}
  .card b{font-size:15px;font-weight:700;display:block;margin-bottom:4px;}
  .card span{font-size:12px;color:var(--muted);}
  .breathe{animation:br 7s ease-in-out infinite;}
  @keyframes br{0%,100%{transform:scale(1);opacity:.96}50%{transform:scale(1.015);opacity:1}}
  .foot{margin-top:40px;color:var(--muted);font-size:12px;}
</style>
</head>
<body>
<div class="aurora"></div>
<div class="wrap">
  <header>
    <div class="brand">Kanban<small>AURORA</small></div>
    <div class="cta">智能分类</div>
  </header>
  <div class="hero">
    <h1>像呼吸一样，自然地把事情理清楚</h1>
    <p>大片的留白与柔和的光晕，让项目管理不再是压力，而是一场从容的整理。</p>
  </div>
  <div class="grid">
    <div class="panel">
      <h3>扫描池</h3>
      <div class="file"><div><div class="n">用户访谈纪要.docx</div><div class="t">2026-07-12</div></div></div>
      <div class="file"><div><div class="n">竞品分析.pdf</div><div class="t">2026-07-10</div></div></div>
      <div class="file"><div><div class="n">需求草稿.md</div><div class="t">2026-07-14</div></div></div>
      <div class="file"><div><div class="n">视觉规范.png</div><div class="t">2026-07-09</div></div></div>
    </div>
    <div class="cards">
      <div class="card breathe"><b>用户研究</b><span>12 个文件</span></div>
      <div class="card breathe"><b>品牌升级</b><span>8 个文件</span></div>
      <div class="card breathe"><b>核心产品</b><span>23 个文件</span></div>
      <div class="card breathe"><b>视觉系统</b><span>9 个文件</span></div>
    </div>
  </div>
  <div class="foot">概念 B · 极光呼吸 — 浅色留白 · 柔光晕 · 缓慢呼吸动效</div>
</div>
</body>
</html>
